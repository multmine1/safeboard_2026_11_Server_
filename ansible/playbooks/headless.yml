- name: Apply the hypervisor boot configuration
  hosts: hypervisors
  become: true
  gather_facts: false
  vars_files:
    - ../../configs/source/vault.json
    - "../../{{ vault_file }}"
    - ../../configs/generated/ansible/hypervisor-bootstrap.json
  vars:
    ansible_become_password: "{{ vault_store.hypervisor_sudo_password }}"
  tasks:
    - name: Apply the declared boot configuration
      ansible.builtin.import_role:
        name: hypervisor
        tasks_from: boot
