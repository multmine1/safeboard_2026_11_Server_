- name: Configure the private hypervisor virtual machine console
  hosts: hypervisors
  become: true
  gather_facts: false
  vars_files:
    - ../../configs/generated/ansible/host-requirements.json
    - ../../configs/generated/ansible/hypervisor-bootstrap.json
    - ../../configs/generated/ansible/sshd.json
    - ../../configs/source/vault.json
    - "../../{{ vault_file }}"
  vars:
    ansible_become_password: "{{ vault_store.hypervisor_sudo_password }}"
  tasks:
    - name: Check the selected host platform before configuring Cockpit
      ansible.builtin.import_role:
        name: hypervisor
        tasks_from: platform
      become: false

    - name: Require the generated Cockpit certificate before exposing its endpoint
      ansible.builtin.assert:
        that: >-
          (hypervisor_cockpit.tls.namespace ~ '/' ~ hypervisor_cockpit.tls.name)
            in vault_store.pki.certificates
        fail_msg: Run the PKI stage before applying the named Cockpit endpoint.

    - name: Prepare independent local resolution of the console name
      ansible.builtin.import_role:
        name: hypervisor
        tasks_from: hosts

    - name: Apply the Cockpit configuration
      ansible.builtin.import_role:
        name: hypervisor
        tasks_from: cockpit

    - name: Apply the declared SSH forwarding permissions
      ansible.builtin.import_role:
        name: hypervisor
        tasks_from: sshd
