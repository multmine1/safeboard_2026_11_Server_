- name: Prepare Forgejo API and runner credentials in the shared Vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../configs/source/vault.json
    - "../../{{ vault_file }}"
    - ../../configs/generated/ansible/hypervisor.json
  vars_prompt:
    - name: vault_password
      prompt: Shared Vault password
      private: true
      confirm: true
  tasks:
    - name: Read the prepared application and tool requirements
      ansible.builtin.include_vars:
        file: "{{ item.file }}"
        name: "{{ item.name }}"
      loop:
        - {file: ../../configs/generated/k0s/applications/deployment.json, name: apps}
        - {file: ../../k0s/requirements/components.json, name: components}
        - {file: ../../configs/generated/k0s/applications/ci/runner.json, name: ci_runner_public}

    - name: Select the declared Forgejo administrator and CI origin in memory
      ansible.builtin.set_fact:
        forgejo_admin: "{{ vault_store.applications[apps.applications.forgejo.namespace]['forgejo-admin'].stringData }}"
        forgejo_origin: "{{ apps.applications.ci.guest.registration.instance | regex_replace('/$', '') }}"
        ci_before: "{{ vault_store.get('ci', {}) }}"
        runner_before: "{{ vault_store.get('runner', {}) }}"
        ci_application_before: "{{ vault_store.applications.get(apps.applications.ci.namespace, {}).get('ci-runner', {}) }}"
      no_log: true

    - name: Prepare the scoped identities through the managed hypervisor
      delegate_to: "{{ controller.admin_alias }}"
      vars:
        ansible_python_interpreter: "{{ controller.python }}"
      block:
        - name: Create a temporary public trust anchor
          ansible.builtin.tempfile:
            state: file
          register: forgejo_ca

        - name: Write only the public CA
          ansible.builtin.copy:
            content: "{{ vault_store.pki.ca.certificate }}"
            dest: "{{ forgejo_ca.path }}"
            mode: '0600'
          no_log: true

        - name: Recover only missing identities while preserving live registrations
          ansible.builtin.include_role:
            name: ci_credentials
          vars:
            ci_credentials_api_before: "{{ ci_before }}"
            ci_credentials_runner_before: "{{ runner_before }}"
            ci_credentials_token_spec: "{{ components.ci.api_token }}"
            ci_credentials_runner_spec: "{{ components.ci.runner_registration | combine({'name': apps.applications.ci.guest.registration.name}) }}"

        - name: Bind the prepared public configuration to the confidential connection
          ansible.builtin.set_fact:
            ci_runner_configuration: >-
              {{ ci_runner_public | combine({'server': {'connections': {
                   'forgejo': {'url': apps.applications.ci.guest.registration.instance,
                               'uuid': ci_credentials_runner.uuid, 'token': ci_credentials_runner.token}}}}) }}
          no_log: true

        - name: Bind only the CI and runner sections while preserving the complete store
          ansible.builtin.set_fact:
            vault_store: >-
              {{ vault_store | combine({'ci': ci_credentials_api,
                   'runner': ci_credentials_runner}) | combine({'applications': {
                     apps.applications.ci.namespace: {'ci-runner': {'type': 'Opaque', 'stringData': {
                       'runner.json': ci_runner_configuration | to_nice_json}}}}}, recursive=true) }}
          no_log: true
      always:
        - name: Remove the temporary public trust anchor
          ansible.builtin.file:
            path: "{{ forgejo_ca.path }}"
            state: absent
          when: forgejo_ca.path is defined

    - name: Save the shared Vault only when an identity was added or changed
      ansible.builtin.include_role:
        name: vault
        tasks_from: write
      when: >-
        vault_store.ci != ci_before or vault_store.runner != runner_before or
        vault_store.applications[apps.applications.ci.namespace]['ci-runner'] != ci_application_before
