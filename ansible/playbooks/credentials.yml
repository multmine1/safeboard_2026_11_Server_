- name: Prepare missing credentials inside the shared Vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../configs/generated/ansible/deployment.json
    - ../../configs/source/vault.json
    - "../../{{ vault_file }}"
  vars_prompt:
    - name: vault_password
      prompt: Shared Vault password
      private: true
      confirm: true
  tasks:
    - name: Generate only the missing guest identities in memory
      ansible.builtin.set_fact:
        vault_store: >-
          {{ vault_store | combine({'guests': {item.configure_vm:
             (item.configure_vm | new_guest_credentials).guest_admin}}, recursive=true) }}
      loop: "{{ stages | selectattr('configure_vm', 'defined') }}"
      when: item.configure_vm not in vault_store.guests
      changed_when: true
      register: guest_identities
      no_log: true

    - name: Generate only the missing backup repository password in memory
      ansible.builtin.set_fact:
        vault_store: >-
          {{ vault_store | combine({'backup': {'repository_password':
             lookup('ansible.builtin.password', '/dev/null',
                    length=backup_password_length, chars=['ascii_letters', 'digits'])}}, recursive=true) }}
      when:
        - backup_password_length is defined
        - vault_store.get('backup', {}).get('repository_password', '') | length == 0
      changed_when: true
      register: backup_credentials
      no_log: true

    - name: Save the complete shared Vault only when credentials were added
      ansible.builtin.include_role:
        name: vault
        tasks_from: write
      when: guest_identities is changed or backup_credentials is changed
