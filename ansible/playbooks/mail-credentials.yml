- name: Prepare mail credentials inside the existing shared Vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../configs/source/vault.json
    - "../../{{ vault_file }}"
  vars_prompt:
    - name: vault_password
      prompt: Shared Vault password
      private: true
      confirm: true
  tasks:
    - name: Read the generated native account plan
      ansible.builtin.include_vars:
        file: ../../configs/generated/k0s/applications/stalwart/credentials.json
        name: mail_credentials_plan

    - name: Read the generated application namespaces
      ansible.builtin.include_vars:
        file: ../../configs/generated/k0s/applications/deployment.json
        name: mail_credentials_apps

    - name: Prepare only missing credentials and preserve all existing sections
      ansible.builtin.include_role:
        name: mail_credentials
