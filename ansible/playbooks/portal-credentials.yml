- name: Prepare the private portal login in the shared Vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../configs/source/vault.json
    - "../../{{ vault_file }}"
  vars_prompt:
    - name: vault_password
      prompt: Shared Vault password
      private: true
      confirm: true
  tasks:
    - name: Read the prepared portal plan and password policy
      ansible.builtin.include_vars:
        file: "{{ item.file }}"
        name: "{{ item.name }}"
      loop:
        - {file: ../../configs/generated/k0s/applications/deployment.json, name: apps}
        - {file: ../../k0s/requirements/components.json, name: components}

    - name: Select only the portal plan and retain the original store in memory
      ansible.builtin.set_fact:
        portal_plan: "{{ apps.applications['admin-portal'] }}"
        portal_auth: "{{ components['admin-portal'].auth }}"
        portal_before: "{{ vault_store }}"
      no_log: true

    - name: Bind the portal's separate native login
      ansible.builtin.include_role:
        name: portal_credentials
        tasks_from: bind

    - name: Save the entire shared store only after a credential change
      ansible.builtin.include_role:
        name: vault
        tasks_from: write
      when: vault_store != portal_before
