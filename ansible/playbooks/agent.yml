- name: Load the Vault key into the existing controller agent
  hosts: libvirt
  gather_facts: false
  vars_files:
    - ../../configs/source/vault.json
    - "../../{{ vault_file }}"
  vars:
    ansible_private_key: "{{ vault_store.vmctl_private_key }}"
    ansible_private_key_passphrase: "{{ vault_store.vmctl_key_passphrase }}"
  tasks:
    - name: Load and verify the controller identity
      block:
        - name: Connect as vmctl and read the configured storage pools
          ansible.builtin.command: virsh -c qemu:///system pool-list
          changed_when: false
      always:
        - name: Release the controller connection
          ansible.builtin.meta: reset_connection
