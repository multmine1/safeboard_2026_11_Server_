- name: Configure prepared private host services
  hosts: hypervisors
  become: true
  gather_facts: false
  vars_files:
    - ../../configs/generated/ansible/host-requirements.json
    - ../../configs/generated/ansible/hypervisor-bootstrap.json
    - ../../configs/generated/ansible/sshd.json
    - ../../configs/source/vault.json
    - "../../{{ vault_file }}"
  vars:
    ansible_become_password: "{{ vault_store.hypervisor_sudo_password }}"
  tasks:
    - name: Check the selected host platform before configuring services
      ansible.builtin.import_role:
        name: hypervisor
        tasks_from: platform
      become: false

    - name: Apply independent host name resolution
      ansible.builtin.import_role:
        name: hypervisor
        tasks_from: hosts

    - name: Apply the private socket proxies
      ansible.builtin.import_role:
        name: hypervisor
        tasks_from: proxies
      when: hypervisor_socket_proxies is defined

    - name: Apply the declared Cockpit configuration
      ansible.builtin.import_role:
        name: hypervisor
        tasks_from: cockpit

    - name: Apply the generated SSH forwarding permissions
      ansible.builtin.import_role:
        name: hypervisor
        tasks_from: sshd
