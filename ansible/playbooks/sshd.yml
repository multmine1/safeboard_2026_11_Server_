- name: Configure the prepared hypervisor SSH policy
  hosts: hypervisors
  become: true
  gather_facts: false
  vars_files:
    - ../../configs/source/vault.json
    - "../../{{ vault_file }}"
    - ../../configs/generated/ansible/sshd.json
  vars:
    ansible_become_password: "{{ vault_store.hypervisor_sudo_password }}"
  tasks:
    - name: Apply the hypervisor SSH account policy
      ansible.builtin.import_role:
        name: hypervisor
        tasks_from: sshd
