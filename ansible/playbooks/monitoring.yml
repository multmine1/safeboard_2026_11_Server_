- name: Configure the hypervisor and libvirt metrics collector
  hosts: hypervisors
  become: true
  gather_facts: false
  vars_files:
    - ../../configs/generated/ansible/hypervisor-bootstrap.json
    - ../../configs/source/vault.json
    - "../../{{ vault_file }}"
  vars:
    ansible_become_password: "{{ vault_store.hypervisor_sudo_password }}"
  tasks:
    - name: Apply the generated host collector configuration
      ansible.builtin.import_role:
        name: hypervisor
        tasks_from: monitoring
