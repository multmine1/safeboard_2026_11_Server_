- name: Apply the router configuration owned by Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - configuration.json
  vars:
    network_plan: "{{ network }}"
    ansible_python_interpreter: "{{ network.python }}"
  tasks:
    - name: Apply the prepared host network
      ansible.builtin.import_tasks: network.yml

    - name: Stop the bootstrap DNS before the managed DNS container starts
      ansible.builtin.systemd_service:
        name: "{{ network.bootstrap_service }}"
        state: stopped
        enabled: false

    - name: Record the successful ownership transfer
      ansible.builtin.copy:
        dest: "{{ network.owner_marker }}"
        content: "k0s\n"
        mode: "{{ network.file_mode }}"
