- name: Read the declared service identity before removing it
  ansible.builtin.getent:
    database: passwd
    key: "{{ reset_service_account.name }}"
    fail_key: false
  become: true
  register: reset_service_identity

- name: Read only its declared private group before deleting it
  ansible.builtin.getent:
    database: group
    key: "{{ reset_service_account.group }}"
    fail_key: false
  become: true
  register: reset_service_group_identity

- name: Protect foundation identities and reject an unexpected service account
  ansible.builtin.assert:
    that:
      - reset_service_account.name not in ['root', reset.controller_user, reset.account.name]
      - reset_service_account.group == reset_service_account.name
      - >-
        (reset_service_entry is none and reset_service_group_entry is none) or
        (reset_service_entry is not none and reset_service_group_entry is not none and
         reset_service_entry[1] | int != 0 and
         reset_service_entry[2] == reset_service_group_entry[1] and
         reset_service_entry[4] == reset_service_account.home and
         reset_service_entry[5] == reset_service_account.shell)
  vars:
    reset_service_entry: "{{ reset_service_identity.ansible_facts.getent_passwd[reset_service_account.name] }}"
    reset_service_group_entry: "{{ reset_service_group_identity.ansible_facts.getent_group[reset_service_account.group] }}"

- name: Wait for only this service account's stopped processes
  ansible.builtin.command:
    argv: [pgrep, -u, "{{ reset_service_identity.ansible_facts.getent_passwd[reset_service_account.name][1] }}"]
  become: true
  when: reset_service_identity.ansible_facts.getent_passwd[reset_service_account.name] is not none
  register: reset_service_processes
  changed_when: false
  failed_when: reset_service_processes.rc not in [0, 1]
  until: reset_service_processes.rc == 1
  retries: "{{ reset.session_retries }}"
  delay: "{{ reset.session_delay_seconds }}"

- name: Remove the declared noninteractive identity without deleting any home tree
  ansible.builtin.user:
    name: "{{ reset_service_account.name }}"
    state: absent
    remove: false
  become: true

- name: Remove only its declared private group
  ansible.builtin.group:
    name: "{{ reset_service_account.group }}"
    state: absent
  become: true
