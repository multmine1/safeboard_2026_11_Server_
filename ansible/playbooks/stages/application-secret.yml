- name: Restrict Vault values to native Secret data and type
  ansible.builtin.assert:
    that: >-
      application_secrets[application.namespace][managed_secret.key].keys() |
      difference(['type', 'data', 'stringData']) | length == 0
  when: managed_secret.value.provider == 'vault'
  no_log: true

- name: Prepare the Secret value only in memory
  ansible.builtin.set_fact:
    desired_secret: >-
      {{ {'apiVersion': 'v1', 'kind': 'Secret',
          'metadata': {'name': managed_secret.key, 'namespace': application.namespace}} |
         combine({'type': 'kubernetes.io/tls', 'stringData': {
           'ca.crt': pki_store.ca.certificate,
           'tls.key': pki_store.certificates[application.namespace ~ '/' ~ managed_secret.key].private_key,
           'tls.crt': pki_store.certificates[application.namespace ~ '/' ~ managed_secret.key].certificate}}
           if managed_secret.value.provider == 'certificate' else
           {'type': 'Opaque', 'stringData': {'ca.crt': pki_store.ca.certificate}}
           if managed_secret.value.provider == 'ca' else
           application_secrets[application.namespace][managed_secret.key]) }}
  no_log: true

- name: Encode native Secret data only in memory
  ansible.builtin.set_fact:
    desired_secret: >-
      {{ desired_secret | dict2items | rejectattr('key', 'equalto', 'stringData') | items2dict |
         combine({'data': desired_secret.data | default({}) | combine(
           dict((desired_secret.stringData | default({})).keys() |
                zip((desired_secret.stringData | default({})).values() | map('b64encode'))))}) }}
  no_log: true

- name: Read only the existing Secret for an idempotent data comparison
  ansible.builtin.command:
    argv: ["{{ cluster.settings.paths.binary }}", kubectl, get, secret, "{{ managed_secret.key }}",
           --namespace, "{{ application.namespace }}", --ignore-not-found, -o, json]
  register: existing_secret
  changed_when: false
  no_log: true

- name: Seal and publish changed Secret values
  when: >-
    existing_secret.stdout | length == 0 or
    (existing_secret.stdout | from_json).get('data', {}) != desired_secret.data or
    (existing_secret.stdout | from_json).get('type', 'Opaque') != desired_secret.get('type', 'Opaque')
  no_log: true
  block:
    - name: Encrypt the Secret for its exact name and namespace
      ansible.builtin.command:
        argv: ["{{ secret_plan.settings.kubeseal.binary }}", --format, json,
               --kubeconfig, "{{ secret_plan.settings.kubeconfig }}",
               --controller-name, "{{ secret_plan.settings.controller_name }}",
               --controller-namespace, "{{ secret_plan.sealing.namespace }}"]
        stdin: "{{ desired_secret | to_json }}"
      register: sealed_secret
      changed_when: false

    - name: Apply only the encrypted SealedSecret
      ansible.builtin.command:
        argv: ["{{ cluster.settings.paths.binary }}", kubectl, apply, -f, '-']
        stdin: "{{ sealed_secret.stdout }}"
      changed_when: true

    - name: Read the current SealedSecret generation
      ansible.builtin.command:
        argv: ["{{ cluster.settings.paths.binary }}", kubectl, get,
               "sealedsecret/{{ managed_secret.key }}", --namespace, "{{ application.namespace }}",
               -o, 'jsonpath={.metadata.generation}']
      register: sealed_generation
      changed_when: false

    - name: Wait for the controller to observe the current SealedSecret
      ansible.builtin.command:
        argv: ["{{ cluster.settings.paths.binary }}", kubectl, wait,
               "--for=jsonpath={.status.observedGeneration}={{ sealed_generation.stdout }}",
               "sealedsecret/{{ managed_secret.key }}", --namespace, "{{ application.namespace }}",
               "--timeout={{ cluster.settings.deployment.readiness_timeout }}"]
      changed_when: false

    - name: Wait for the current SealedSecret to synchronize
      ansible.builtin.command:
        argv: ["{{ cluster.settings.paths.binary }}", kubectl, wait,
               --for=condition=Synced, "sealedsecret/{{ managed_secret.key }}",
               --namespace, "{{ application.namespace }}",
               "--timeout={{ cluster.settings.deployment.readiness_timeout }}"]
      changed_when: false

    - name: Record the changed Secret for its consumers
      ansible.builtin.set_fact:
        application_secrets_changed: true
