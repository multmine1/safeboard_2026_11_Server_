- name: Select only the repository credential for this native writer
  ansible.builtin.set_fact:
    hypervisor_backup_credentials:
      - name: repository-password
        value: "{{ vault_store.backup.repository_password }}"
  no_log: true

- name: Pin each existing producer's host identity and prepare its runtime credentials
  ansible.builtin.include_tasks: backup-guest.yml
  loop: "{{ hypervisor_backup.connections | dict2items }}"
  loop_control:
    loop_var: hypervisor_backup_guest
    label: "{{ hypervisor_backup_guest.key }}"

- name: Reconcile native encrypted credentials without plaintext files
  ansible.builtin.include_tasks: backup-credential.yml
  loop: "{{ hypervisor_backup_credentials }}"
  loop_control:
    loop_var: hypervisor_backup_credential
    label: "{{ hypervisor_backup_credential.name }}"
  no_log: true
