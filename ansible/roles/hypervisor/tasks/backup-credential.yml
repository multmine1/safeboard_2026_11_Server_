- name: Inspect only the encrypted service credential
  ansible.builtin.stat:
    path: "{{ hypervisor_backup.credential_directory }}/{{ hypervisor_backup_credential.name }}.cred"
    get_checksum: false
  register: hypervisor_backup_existing_credential
  no_log: true

- name: Compare the existing encrypted credential in memory
  ansible.builtin.command:
    argv:
      - systemd-creds
      - decrypt
      - "--name={{ hypervisor_backup_credential.name }}"
      - "{{ hypervisor_backup.credential_directory }}/{{ hypervisor_backup_credential.name }}.cred"
      - '-'
    strip_empty_ends: false
  when: hypervisor_backup_existing_credential.stat.exists
  register: hypervisor_backup_decrypted_credential
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Identify only a missing changed or unreadable runtime credential
  ansible.builtin.set_fact:
    hypervisor_backup_credential_changed: >-
      {{ not hypervisor_backup_existing_credential.stat.exists or
         hypervisor_backup_decrypted_credential.rc != 0 or
         (hypervisor_backup_credential.public_key is defined and
          not (hypervisor_backup_decrypted_credential.stdout | ssh_key_matches(hypervisor_backup_credential.public_key))) or
         (hypervisor_backup_credential.public_key is not defined and
          hypervisor_backup_decrypted_credential.stdout != hypervisor_backup_credential.value) }}
  no_log: true

- name: Report a pending credential replacement without writing in check mode
  ansible.builtin.debug:
    msg: A native runtime credential requires reconciliation.
  changed_when: true
  when: ansible_check_mode and hypervisor_backup_credential_changed

- name: Replace only a missing or changed runtime credential
  when: not ansible_check_mode and hypervisor_backup_credential_changed
  no_log: true
  block:
    - name: Encrypt the service input using the native host key
      ansible.builtin.command:
        argv: [systemd-creds, encrypt, "--name={{ hypervisor_backup_credential.name }}", "--with-key={{ hypervisor_backup.credential_key }}", '-', '-']
        stdin: "{{ hypervisor_backup_credential.value }}"
        stdin_add_newline: false
      register: hypervisor_backup_encrypted_credential
      changed_when: false

    - name: Store only the host-encrypted runtime credential
      ansible.builtin.copy:
        content: "{{ hypervisor_backup_encrypted_credential.stdout }}\n"
        dest: "{{ hypervisor_backup.credential_directory }}/{{ hypervisor_backup_credential.name }}.cred"
        owner: root
        group: root
        mode: '0600'
