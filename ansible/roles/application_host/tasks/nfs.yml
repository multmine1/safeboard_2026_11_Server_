- name: Create the prepared exported directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ application_host_plan.nfs_exports }}"

- name: Persist the prepared NFS client permissions
  ansible.builtin.template:
    src: exports.j2
    dest: "{{ application_host_plan.nfs.exports_path }}"
    mode: "{{ application_host_plan.nfs.file_mode }}"
    backup: true
  register: application_host_nfs_files
