- name: Verify only the resulting host fixture
  delegate_to: "{{ controller.admin_alias }}"
  become: true
  vars:
    ansible_python_interpreter: "{{ controller.python }}"
  block:
    - name: Inspect the preserved repository data when preservation was selected
      ansible.builtin.stat:
        path: "{{ reset.backup_repository_access.repository }}/data"
        checksum_algorithm: sha256
        get_mime: false
        get_attributes: false
      register: reset_test_preserved_data
      when: reset_test_policy == 'preserve'

    - name: Require preserved bytes and both surviving ownership identifiers
      ansible.builtin.assert:
        that:
          - reset_test_preserved_data.stat.checksum == ('preserve these backup bytes\n' | hash('sha256'))
          - reset_test_preserved_data.stat.uid | int == reset_admin_account.ansible_facts.getent_passwd[reset.controller_user][1] | int
          - reset_test_preserved_data.stat.gid | int == reset_admin_account.ansible_facts.getent_passwd[reset.controller_user][2] | int
      when: reset_test_policy == 'preserve'

    - name: Require reviewed fixture removal targets to be absent
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
        get_mime: false
        get_attributes: false
      loop: "{{ reset.remove_files + reset.remove_links + reset.volume_directories + reset.remove_directories + [reset.account.home] }}"
      register: reset_test_removed

    - name: Require every reviewed fixture path to have been removed
      ansible.builtin.assert:
        that: reset_test_removed.results | selectattr('stat.exists') | list | length == 0

    - name: Read only the numeric fixture ACLs after account removal
      ansible.builtin.command:
        argv: "{{ ['getfacl', '--numeric'] + reset.backup_repository_access.parents }}"
      register: reset_test_acls
      changed_when: false

    - name: Require the removed UID to have no remaining ancestor ACL
      ansible.builtin.assert:
        that: "('user:' ~ reset_test_uid ~ ':') not in reset_test_acls.stdout"

    - name: Read only fixture trust and configuration files after cleanup
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: ["{{ reset.controller_access.known_hosts }}", "{{ reset.controller_access.ssh_config }}", "{{ reset_test_root }}/keep"]
      register: reset_test_kept_files

    - name: Require physical host trust and unrelated fixture configuration to remain
      ansible.builtin.assert:
        that:
          - (reset_test_kept_files.results[0].content | b64decode) == reset_test_kept_trust
          - (reset_test_kept_files.results[1].content | b64decode) == 'Host keep-host\n'
          - (reset_test_kept_files.results[2].content | b64decode) == 'keep this unrelated fixture file\n'

- name: Read the preserved backup as the surviving administrator without sudo
  ansible.builtin.slurp:
    src: "{{ reset.backup_repository_access.repository }}/data"
  delegate_to: "{{ controller.admin_alias }}"
  become: false
  vars:
    ansible_python_interpreter: "{{ controller.python }}"
  register: reset_test_admin_read
  when: reset_test_policy == 'preserve'

- name: Require direct administrator access to the preserved bytes
  ansible.builtin.assert:
    that: (reset_test_admin_read.content | b64decode) == 'preserve these backup bytes\n'
  when: reset_test_policy == 'preserve'

- name: Read only the disposable controller trust file
  ansible.builtin.slurp:
    src: "{{ reset.controller_known_hosts }}"
  register: reset_test_local_trust

- name: Require only the physical host identity to remain on the controller
  ansible.builtin.assert:
    that: (reset_test_local_trust.content | b64decode) == reset_test_kept_trust
