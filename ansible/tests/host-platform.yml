- name: Check the source-selected host platform without changing a host
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    hypervisor_platform:
      distribution: Debian
      major_version: '13'
    ansible_facts:
      distribution: Debian
      distribution_major_version: '13'
  tasks:
    - name: Accept matching platform facts
      ansible.builtin.import_role:
        name: hypervisor
        tasks_from: platform

    - name: Check independent distribution and release mismatches
      ansible.builtin.include_tasks: host-platform-case.yml
      loop:
        - {distribution: Ubuntu, distribution_major_version: '26'}
        - {distribution: Debian, distribution_major_version: '12'}
      loop_control:
        loop_var: platform_case
