- name: Check the prepared mail credential binding without Vault or a mail server
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mail_credentials_plan:
      accounts:
        '@type': upsert
        object: Account
        matchOn: [name, domainId]
        value:
          postmaster:
            '@type': User
            name: postmaster
            domainId: '#mail-domain'
            roles: {'@type': Admin}
            quotas: {maxDiskQuota: 21474836480}
          forgejo:
            '@type': User
            name: forgejo
            domainId: '#mail-domain'
            permissions:
              '@type': Replace
              enabledPermissions: {authenticate: true, emailSend: true}
    mail_credentials_store:
      accounts:
        postmaster: {password: clear-value-for-test, password_hash: hash-for-test}
        forgejo: {password: another-clear-value, password_hash: another-hash}
  tasks:
    - name: Render only the native operation with bound password hashes
      ansible.builtin.set_fact:
        rendered_mail_accounts: "{{ lookup('ansible.builtin.template', '../roles/mail_credentials/templates/accounts.ndjson.j2') | from_json }}"

    - name: Require preservation of prepared identities and least privilege
      ansible.builtin.assert:
        that:
          - rendered_mail_accounts['@type'] == 'upsert'
          - rendered_mail_accounts.matchOn == ['name', 'domainId']
          - rendered_mail_accounts['value'].postmaster.domainId == '#mail-domain'
          - rendered_mail_accounts['value'].postmaster.quotas.maxDiskQuota == 21474836480
          - rendered_mail_accounts['value'].forgejo.permissions == mail_credentials_plan.accounts['value'].forgejo.permissions
          - rendered_mail_accounts['value'].postmaster.credentials['0'].secret == 'hash-for-test'
          - rendered_mail_accounts['value'].forgejo.credentials['0'].secret == 'another-hash'
          - "'clear-value-for-test' not in (rendered_mail_accounts | to_json)"
          - "'another-clear-value' not in (rendered_mail_accounts | to_json)"
