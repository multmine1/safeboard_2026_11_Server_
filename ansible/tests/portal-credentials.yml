- name: Check the portal's isolated credential binding without real secrets
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    portal_plan: {namespace: public}
    portal_auth: {username: admin, password_length: 32, bcrypt_rounds: 4}
    vault_store:
      admin_portal: {password: fixture-password-one}
      guests: {preserved: fixture-identity}
      applications:
        public:
          preserved: {type: Opaque, stringData: {value: fixture-value}}
  tasks:
    - name: Bind the first portal login
      ansible.builtin.include_role:
        name: portal_credentials
        tasks_from: bind

    - name: Remember the complete first store
      ansible.builtin.set_fact:
        portal_first: "{{ vault_store }}"
      no_log: true

    - name: Bind the same login again
      ansible.builtin.include_role:
        name: portal_credentials
        tasks_from: bind

    - name: Require stable credentials and preserved unrelated secrets
      ansible.builtin.assert:
        that:
          - vault_store == portal_first
          - vault_store.guests.preserved == 'fixture-identity'
          - vault_store.applications.public.preserved.stringData.value == 'fixture-value'
          - "vault_store.applications.public['admin-portal-auth'].stringData.htpasswd.startswith('admin:')"
          - >-
            vault_store.applications.public['admin-portal-auth'].stringData.htpasswd.endswith('\n')
      no_log: true

    - name: Change only the requested portal password
      ansible.builtin.set_fact:
        vault_store: "{{ vault_store | combine({'admin_portal': {'password': 'fixture-password-two'}}, recursive=true) }}"
      no_log: true

    - name: Bind the changed password
      ansible.builtin.include_role:
        name: portal_credentials
        tasks_from: bind

    - name: Require only the portal hash to change
      ansible.builtin.assert:
        that:
          - vault_store.admin_portal.password_hash != portal_first.admin_portal.password_hash
          - vault_store.guests == portal_first.guests
          - vault_store.applications.public.preserved == portal_first.applications.public.preserved
      no_log: true
