- name: Refuse requirements selected for another platform
  block:
    - name: Apply the production platform guard with differing facts
      ansible.builtin.include_role:
        name: hypervisor
        tasks_from: platform
      vars:
        ansible_facts: "{{ platform_case }}"

    - name: Fail when a mismatching platform was accepted
      ansible.builtin.fail:
        msg: The platform guard accepted the wrong operating system.
  rescue:
    - name: Require rejection by our platform assertion
      ansible.builtin.assert:
        that:
          - ansible_failed_task.name == 'Require the operating system selected in the generated host requirements'
          - "'The running OS differs' in ansible_failed_result.msg"
