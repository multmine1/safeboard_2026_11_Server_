[defaults]
inventory = ../configs/generated/ansible/inventory.json
roles_path = roles
filter_plugins = filter_plugins
collections_path = ../environment/.tools/ansible/collections
log_path = ../environment/.tools/ansible.log

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
control_path_dir = ../environment/.tools/ansible/cp
